name: Deploy

on:
  push:
    branches:
      - env/production
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation de déploiement (sans écriture)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PHP_VERSION: "8.1"
  NODE_VERSION: "24"
  THEME_PATH: web/app/themes/cgibelli

jobs:
  deploy:
    name: Build & deploy (production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Validation des secrets
      # ------------------------------------------------------------------
      - name: Vérifier les secrets requis
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          for name in SSH_HOST SSH_USER FTP_PASSWORD DEPLOY_PATH; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing"
            exit 1
          fi

      # ------------------------------------------------------------------
      # PHP / Composer
      # ------------------------------------------------------------------
      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: simplexml, json, intl, curl, mbstring
          tools: composer:v2
          coverage: none

      - name: Valider composer.json / composer.lock
        run: composer validate --no-check-publish

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: composer install (prod)
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      # ------------------------------------------------------------------
      # Build du thème (Webpack)
      # ------------------------------------------------------------------
      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: yarn install
        working-directory: ${{ env.THEME_PATH }}
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build production (webpack)
        working-directory: ${{ env.THEME_PATH }}
        run: yarn production

      - name: Vérifier le résultat du build
        working-directory: ${{ env.THEME_PATH }}
        run: |
          for artifact in assets/scripts/app.js assets/styles/styles.css; do
            if [ ! -s "$artifact" ]; then
              echo "::error::Build incomplet, fichier absent ou vide : $artifact"
              exit 1
            fi
          done
          echo "Assets générés :"
          du -sh assets/*

      # ------------------------------------------------------------------
      # Déploiement via FTPS (Port 21 sécurisé)
      # ------------------------------------------------------------------
      # DEPLOY_PATH est un chemin absolu hérité de la version rsync/SSH
      # (ex. /home/user/projet). La session FTP étant chrootée sur /home/user,
      # un server-dir absolu ferait créer une arborescence fantôme
      # /home/user/home/user/projet. On le convertit donc en chemin relatif.
      - name: Calculer le chemin FTP (relatif à la racine de session)
        id: ftp
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rel="${DEPLOY_PATH#/home/$SSH_USER}"
          rel="${rel#/}"
          rel="${rel%/}"
          echo "dir=${rel:+$rel/}" >> "$GITHUB_OUTPUT"
          echo "server-dir utilisé : '${rel:+$rel/}'"

      - name: 🚀 Déployer les fichiers via FTP sécurisé
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SSH_HOST }} # Réutilise blizz.o2switch.net
          username: ${{ secrets.SSH_USER }} # Réutilise ton user chgi3340
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: ${{ steps.ftp.outputs.dir }}
          # inputs.dry_run n'existe que sur workflow_dispatch : vide sur un push
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          log-level: verbose
          # Aligné sur le .gitignore racine, à UNE exception près :
          # web/app/themes/cgibelli/assets/ y est ignoré (c'est un build) mais
          # doit impérativement être déployé — c'est le produit de webpack.
          # Ne jamais ajouter assets/ ici : le thème partirait sans CSS ni JS.
          exclude: |
            **/.git*
            **/.git*/**
            **/.vscode/**
            **/.idea/**
            **/.claude/**
            **/node_modules/**
            **/*.log
            **/.env
            **/.env.*
            **/wp-cli.local.yml
            **/.htaccess
            **/app/uploads/**
            **/app/cache/**
            **/app/upgrade/**
            **/app/languages/**
            **/app/advanced-cache.php
            **/app/object-cache.php
            **/app/db.php
            **/app/wp-rocket-config/**
            **/web/app/themes/twentytwentythree/**